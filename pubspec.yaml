name: libtorrent_flutter
description: >
  Native libtorrent 2.0 bindings for Flutter with a built-in HTTP streaming
  server for instant torrent video playback. Supports Windows, Linux, macOS,
  iOS, and Android.
version: 2.0.1-dev.1
homepage: https://github.com/SX-Code/libtorrent_flutter
repository: https://github.com/SX-Code/libtorrent_flutter
issue_tracker: https://github.com/SX-Code/libtorrent_flutter/issues
topics:
  - torrent
  - streaming
  - libtorrent
  - ffi

environment:
  sdk: ^3.5.0
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  ffigen: ^12.0.0
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
  assets:
    - assets/cacert.pem
